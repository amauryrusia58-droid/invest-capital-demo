<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Invest Capital · Mi cuenta</title>
<style>*{box-sizing:border-box}body{background:#121122;color:#faf9ff;font:1rem/1.5 system-ui;margin:0}main{max-width:28rem;margin:8vh auto;padding:1.6rem}h1{line-height:1.15}label{display:block;margin:1rem 0}input,button{font:inherit;border-radius:.5rem;padding:.7rem}input{width:100%;border:1px solid #88849b}button{background:#ded4ff;color:#211339;border:0;cursor:pointer;margin:.25rem .25rem .25rem 0}button:disabled{opacity:.6}small{color:#d8cbff}</style></head>
<body><main><small>Invest Capital · Mi cuenta</small>
<h1 id="title">Mi cuenta</h1>
<p id="status" role="status" aria-live="polite">Comprobando la sesión…</p>
<form id="verify" hidden><label>Correo electrónico<input type="email" name="email" autocomplete="email" required></label><label>Código recibido por correo<input name="token" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required></label><button>Confirmar código</button></form>
<form id="change" hidden><label>Nueva contraseña<input type="password" name="password" autocomplete="new-password" minlength="8" required></label><button>Guardar contraseña</button></form>
<section id="profile" hidden><p id="name"></p><p id="email"></p><button id="logout">Cerrar sesión</button></section>
<p><a style="color:#ded4ff" href="index.html?login=1">Volver al acceso</a></p></main>
<script src="config.js"></script><script src="supabase.js"></script><script type="module" src="cuenta.js"></script></body></html>
