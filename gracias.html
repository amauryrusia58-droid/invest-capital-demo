<html lang="es">

p{color:#c2ded0}
a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:9px;background:#82f1bd;color:#09231a;font-weight:750;text-decoration:none}
a:hover{background:#b3f9d5}
a:focus-visible{outline:3px solid white;outline-offset:4px}

</head>

<main>
  <div class="brand">Invest Capital Demo</div>
