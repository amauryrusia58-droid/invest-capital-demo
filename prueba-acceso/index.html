<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Invest Capital · Prueba de acceso</title>
<style>*{box-sizing:border-box}body{background:#121122;color:#faf9ff;font:1rem/1.5 system-ui;margin:0}main{max-width:28rem;margin:8vh auto;padding:1.6rem}h1{line-height:1.15}label{display:block;margin:1rem 0}input,button{font:inherit;border-radius:.5rem;padding:.7rem}input{width:100%;border:1px solid #88849b}button{background:#ded4ff;color:#211339;border:0;cursor:pointer;margin:.25rem .25rem .25rem 0}button:disabled{opacity:.6}small{color:#d8cbff}</style></head>
<body><main><small>Invest Capital · Prueba de acceso</small>
<h1 id="title">Acceso de usuarios</h1>
<nav id="nav"><button data-mode="signup">Crear cuenta</button><button data-mode="login">Iniciar sesión</button></nav>
<form id="form" hidden>
<label id="nameLabel">Nombre y apellidos<input name="name" autocomplete="name" maxlength="60"></label>
<label>Correo electrónico<input type="email" name="email" required autocomplete="email"></label>
<label id="passLabel">Contraseña<input type="password" name="password"></label>
<label id="codeLabel" hidden>Código del correo<input name="token" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}"></label>
<button id="submit">Continuar</button></form>
<section id="profile" hidden><p id="name"></p><p id="email"></p><button id="out">Cerrar sesión</button></section>
<p id="status" role="status" aria-live="polite"></p>
</main><script src="config.js"></script><script src="supabase.js"></script><script src="publico.js"></script></body></html>
