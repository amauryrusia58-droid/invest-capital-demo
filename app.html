<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09070f"><title>Invest Capital | Mi cuenta</title><link rel="stylesheet" href="styles.css?v=90"><style>
/* V9.1: historial de ganancias, legible en computadoras y móviles. */
.ic-history-pane{padding:26px!important;border-color:#79549c!important}
.ic-history-head h2{font-size:clamp(24px,2.3vw,30px);margin:7px 0 10px;color:#faf4ff}
.ic-history-eyebrow{color:#ccadf5;font-size:12px;letter-spacing:1.2px;font-weight:800}
.ic-history-head p{font-size:16px;line-height:1.6;color:#d4c5e4;margin:0 0 22px;max-width:950px}
.ic-history-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.ic-history-item{min-width:0;border:1px solid #695081;background:linear-gradient(145deg,#352044,#1b1328);border-radius:15px;padding:22px 20px}
.ic-history-label{display:block;color:#ead8fa;font-size:17px;line-height:1.35;font-weight:750;min-height:46px}
.ic-history-number{display:block;font-size:clamp(27px,2.5vw,36px);font-variant-numeric:tabular-nums;line-height:1.2;letter-spacing:-.5px;overflow-wrap:anywhere;margin:14px 0 12px;color:#fff}
.ic-history-item p{font-size:15px;line-height:1.65;color:#d4c5e3;margin:0}
.ic-history-available{border-color:#b285d7;background:linear-gradient(145deg,#3d2352,#241631)}
.ic-history-footnote{font-size:14px;line-height:1.55;color:#bda9cb;margin:18px 0 0}
@media(max-width:1050px){.ic-history-grid{grid-template-columns:1fr}.ic-history-label{min-height:0}.ic-history-item{padding:18px}.ic-history-pane{padding:19px!important}}
@media(max-width:460px){.ic-history-head p{font-size:15px}.ic-history-label{font-size:16px}.ic-history-number{font-size:30px}.ic-history-item p{font-size:15px}}

/* V9.4 — verde únicamente para retiros aprobados; demás estados intactos. */
.tag.ic-withdrawal-approved {
  display: inline-flex;
  align-items: center;
  color: #d7ffed !important;
  background: #136444 !important;
  border: 1px solid #48dfa0 !important;
  border-radius: 999px;
  font-weight: 800;
  padding: 5px 11px;
  box-shadow: 0 0 0 1px rgba(72,223,160,.12);
}

/* V9.6 — Activación de plan en azul; retiro aprobado permanece verde. */
.tag.ic-plan-activated {
  display: inline-flex;
  align-items: center;
  color: #e1efff !important;
  background: #27457f !important;
  border: 1px solid #79adff !important;
  border-radius: 999px;
  font-weight: 800;
  padding: 5px 11px;
  box-shadow: 0 0 0 1px rgba(121,173,255,.13);
}
#selectedPlanAction.ic-plan-active-button,
#selectedPlanAction.ic-plan-active-button:disabled {
  color: #e8f2ff !important;
  background: linear-gradient(110deg,#305ca9,#426ebd) !important;
  border: 1px solid #8bb8ff !important;
  box-shadow: 0 4px 18px rgba(63,110,189,.24);
  opacity: 1 !important;
  cursor: default;
}

/* V10.0 — navegación accesible en móvil; escritorio sin modificaciones. */
.ic-mobile-nav-toggle,.ic-mobile-nav-scrim{display:none}
@media(max-width:750px){
 .ic-mobile-nav-toggle{display:inline-flex;gap:9px;align-items:center;justify-content:center;position:relative;z-index:9;margin:0 0 18px;padding:12px 16px;background:#352045;border:1px solid #9c6fbb;border-radius:12px;color:#fff;font-size:15px;font-weight:750;min-height:46px}
 .dash-layout>.sidebar{display:flex!important;flex-direction:column!important;gap:18px;position:fixed!important;inset:0 auto 0 0!important;width:min(85vw,320px)!important;height:100dvh;max-height:100dvh;overflow-y:auto;z-index:102!important;transform:translateX(-105%);transition:transform .2s ease;box-shadow:12px 0 45px #0008;padding:28px 18px!important;background:#180d25!important;border-right:1px solid #74518a!important}
 .dash-layout>.sidebar .brand{display:inline-flex!important}
 .dash-layout>.sidebar .sidebar-title{display:block!important}
 .dash-layout>.sidebar .side-foot{display:block!important}
 .dash-layout>.sidebar .side-menu{display:flex!important;flex-direction:column!important;gap:5px;overflow:visible!important;white-space:normal!important}
 .dash-layout>.sidebar .side-link{width:100%;min-height:44px;padding:12px 14px;display:flex;flex-shrink:0}
 .dash-layout>.sidebar .side-icon{display:grid!important}
 .ic-mobile-nav-scrim{display:block;position:fixed;inset:0;background:rgba(4,2,9,.67);z-index:101;opacity:0;pointer-events:none;transition:opacity .2s}
 body.ic-mobile-menu-open .dash-layout>.sidebar{transform:translateX(0)}
 body.ic-mobile-menu-open .ic-mobile-nav-scrim{opacity:1;pointer-events:auto}
 body.ic-mobile-menu-open{overflow:hidden}
 .dash-main{min-width:0!important}
}
@media(prefers-reduced-motion:reduce){.dash-layout>.sidebar,.ic-mobile-nav-scrim{transition:none!important}}
